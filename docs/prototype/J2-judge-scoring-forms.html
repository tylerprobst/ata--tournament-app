<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0F1218"/>
<title>J2 — Judge scoring forms</title>
<style>

/* ATA Ring Day — inlined hard-coded tokens for file:// + http */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0a0a0c;
  color: #F2F4F8;
  -webkit-font-smoothing: antialiased;
  height: 100%;
}
body.phone-frame-outer, html.phone-frame-outer {
  margin: 0; padding: 0; background: #0a0a0c;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
.phone-wrap {
  width: 100%;
  max-width: 430px;
  height: 100dvh;
  min-height: 100dvh;
  margin: 0 auto;
  background: #0F1218;
  color: #F2F4F8;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
}
.phone-status {
  height: 44px;
  padding: 12px 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
  color: #F2F4F8;
}
.phone-status .time { font-variant-numeric: tabular-nums; }
.phone-status .icons {
  display: flex; gap: 6px; align-items: center; font-size: 12px; opacity: 0.85;
}
.shell-bar, .phone-wrap .shell-bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 16px; min-height: 48px;
  background: #242B3D; border-bottom: 1px solid #2E3648; flex-shrink: 0;
}
.shell-bar .title, .phone-wrap .shell-bar .title {
  font-weight: 600; font-size: 15px; color: #F2F4F8;
}
.shell-nav, .phone-wrap .shell-nav {
  display: flex; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid #2E3648; flex-shrink: 0;
  background: #1A2030; flex-wrap: nowrap;
}
.shell-nav span, .shell-nav a,
.phone-wrap .shell-nav span, .phone-wrap .shell-nav a {
  flex: 1; text-align: center; padding: 10px 4px; border-radius: 6px;
  font-size: 12px; font-weight: 600; color: #A8B0C0;
  min-height: 44px; display: flex; align-items: center; justify-content: center;
  text-decoration: none; cursor: pointer;
}
.shell-nav .active, .phone-wrap .shell-nav .active {
  background: #E11D2E; color: #ffffff; opacity: 1;
}
.shell-nav span:not(.active), .shell-nav a:not(.active) {
  opacity: 0.3; cursor: default; pointer-events: none;
}
.body, .phone-wrap .body {
  padding: 12px 16px 16px; flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch; background: #0F1218; color: #F2F4F8;
}
.home-ind {
  height: 28px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: #1A2030;
}
.home-ind i {
  display: block; width: 120px; height: 4px; border-radius: 2px;
  background: #6B7385; opacity: 0.55;
}
.back-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; font-weight: 600; color: #A8B0C0;
  text-decoration: none; padding: 8px 10px; border-radius: 8px;
  background: transparent; border: 1px solid #2E3648;
  min-height: 40px; margin-bottom: 10px;
  cursor: pointer;
}
.back-chip:active, .back-chip:hover { color: #F2F4F8; border-color: #4DA3FF; }
.hub-chip {
  font-size: 11px; font-weight: 600; color: #6B7385;
  text-decoration: none; padding: 6px 10px; border-radius: 6px;
  background: rgba(36, 43, 61, 0.9); border: 1px solid #2E3648;
  white-space: nowrap;
}
.hub-chip:hover { color: #F2F4F8; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
}
.badge-offline {
  background: rgba(196, 92, 0, 0.22); color: #C45C00; border: 1px solid #C45C00;
}
.badge-status-active { background: rgba(11, 110, 79, 0.22); color: #0B6E4F; }
.badge-status-held { background: rgba(196, 92, 0, 0.22); color: #C45C00; }
.badge-status-idle { background: rgba(138, 143, 152, 0.22); color: #8A8F98; }
.badge-status-locked { background: rgba(61, 68, 81, 0.30); color: #A8B0C0; }
.badge-danger { background: rgba(176, 0, 32, 0.22); color: #B00020; }
.badge-info { background: rgba(77, 163, 255, 0.18); color: #4DA3FF; }
.badge-primary {
  background: rgba(11, 110, 79, 0.20); color: #0B6E4F; border: 1px solid #0B6E4F;
}
.badge-fallback {
  background: rgba(196, 92, 0, 0.18); color: #C45C00; border: 1px solid #C45C00;
}
.h1 { font-size: 22px; font-weight: 600; margin: 0 0 12px; color: #F2F4F8;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.h2 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; color: #A8B0C0;
  text-transform: uppercase; letter-spacing: 0.04em; }
.meta { font-size: 13px; color: #A8B0C0; }
.muted { color: #6B7385; font-size: 13px; }
.btn, button, a.btn {
  appearance: none; -webkit-appearance: none;
  border: 1px solid #2E3648;
  background: #242B3D; color: #F2F4F8;
  border-radius: 10px; padding: 12px 16px;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-weight: 600; font-size: 15px;
  cursor: pointer; min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn-primary, button.primary, a.btn-primary, a.primary {
  background: #E11D2E; color: #ffffff; border-color: #E11D2E;
}
.btn-ghost { background: transparent; }
.btn-lg { min-height: 72px; font-size: 18px; padding: 16px 20px; }
.btn-block { width: 100%; }
.btn:active, button:active { transform: scale(0.98); }
.btn.selected, button.selected {
  background: #E11D2E; color: #ffffff; border-color: #E11D2E;
  box-shadow: 0 0 0 2px rgba(225, 29, 46, 0.35);
}
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: #A8B0C0; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1px solid #2E3648; border-radius: 6px;
  background: #0F1218; color: #F2F4F8;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
}
.field textarea { min-height: 88px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 120px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 14px; border: 1px solid #2E3648; border-radius: 10px;
  background: #242B3D; min-height: 48px; color: #F2F4F8;
}
a.list-item { text-decoration: none; cursor: pointer; }
a.list-item:active, .list-item.tap:active { border-color: #4DA3FF; }
.list-item.tap { cursor: pointer; }
.chip {
  display: inline-flex; align-items: center; padding: 4px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
}
.chip-red { background: #C8102E; color: #fff; }
.chip-white { background: #F5F5F5; color: #1A1A1A; border: 1px solid #D0D0D0; }
.chip-bye { background: #8A8F98; color: #fff; }
.radio, .check {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; border: 1px solid #2E3648; border-radius: 10px;
  min-height: 48px; margin-bottom: 6px; background: #242B3D; color: #F2F4F8;
  cursor: pointer; user-select: none;
}
.radio.on, .check.on { border-color: #E11D2E; box-shadow: inset 0 0 0 1px #E11D2E; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #A8B0C0; flex-shrink: 0; }
.radio.on .dot {
  border-color: #E11D2E;
  background: radial-gradient(circle, #E11D2E 45%, transparent 50%);
}
.box { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #A8B0C0; flex-shrink: 0; }
.check.on .box { background: #E11D2E; border-color: #E11D2E; }
.page-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  color: #6B7385; text-transform: uppercase; margin-bottom: 4px;
}
.note {
  margin-top: 12px; padding: 10px 12px; border-radius: 6px;
  background: rgba(77, 163, 255, 0.12);
  border: 1px solid rgba(77, 163, 255, 0.35);
  font-size: 13px; color: #A8B0C0;
}
.warn-note {
  margin-top: 12px; padding: 10px 12px; border-radius: 6px;
  background: rgba(196, 92, 0, 0.14);
  border: 1px solid rgba(196, 92, 0, 0.40);
  font-size: 13px; color: #A8B0C0;
}
.success-note {
  margin-top: 12px; padding: 10px 12px; border-radius: 6px;
  background: rgba(11, 110, 79, 0.18);
  border: 1px solid rgba(11, 110, 79, 0.45);
  font-size: 13px; color: #A8B0C0;
  display: none;
}
.success-note.show { display: block; }
.wordmark-rule {
  height: 3px; width: 48px; background: #E11D2E; border-radius: 2px; margin: 4px 0 12px;
}
strong { color: #F2F4F8; font-weight: 700; }
p { color: #F2F4F8; }
.score-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.score-grid button {
  min-height: 72px; font-size: 24px; font-weight: 700;
}

</style>
</head>
<body class="theme-ringDay phone-frame-outer" data-theme="ringDay">
  <div class="phone-wrap" id="frame">    <div class="phone-status">
      <span class="time">9:41</span>
      <span class="icons">●●● LTE 🔋</span>
    </div>
    <div class="shell-bar">
      <div>
        <div class="title">Forms score</div>
        <div class="wordmark-rule"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a class="hub-chip" href="index.html">Hub</a>
        <span class="badge badge-offline">Offline</span>
      </div>
    </div>
    <div class="shell-nav"><a href="index.html" class="active">Home</a><span class="">Schedule</span><span class="">Me</span><span class="">Alerts</span></div>
    <div class="body">
<a class="back-chip" href="J1-judge-assignment.html">← Back</a>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
        <h1 class="h1" style="margin:0">Forms score · Seat 2</h1>
        <span class="badge badge-primary">PRIMARY</span>
      </div>
      <p class="meta" style="margin-bottom:12px">Competitor: Casey</p>
      <div class="h2" style="margin-top:12px">Score 1–9</div>
      <div class="score-grid">
        <button type="button" data-score="1">1</button>
        <button type="button" data-score="2">2</button>
        <button type="button" data-score="3">3</button>
        <button type="button" data-score="4">4</button>
        <button type="button" data-score="5">5</button>
        <button type="button" data-score="6">6</button>
        <button type="button" data-score="7">7</button>
        <button type="button" data-score="8">8</button>
        <button type="button" data-score="9">9</button>
      </div>
      <button type="button" id="submit-score" class="primary btn-block btn-lg" style="margin-top:16px">Submit score</button>
      <div id="held-feedback" class="success-note" style="margin-top:12px"></div>
      <p class="meta" style="margin-top:12px">Held for simultaneous reveal · waiting other judges…</p>
      <a class="btn btn-block" style="margin-top:12px" href="J3-judge-sparring-presence.html">Sparring presence →</a>
    </div>
    <div class="home-ind"><i></i></div>
  </div>

<script>
(function(){
  // Toggle checkboxes
  document.querySelectorAll('.check').forEach(function(el){
    el.addEventListener('click', function(){
      el.classList.toggle('on');
    });
  });
  // Radio groups: siblings under same parent block
  document.querySelectorAll('.radio').forEach(function(el){
    el.addEventListener('click', function(){
      var group = el.parentElement;
      // Prefer data-group if set
      var g = el.getAttribute('data-group');
      if (g) {
        document.querySelectorAll('.radio[data-group="'+g+'"]').forEach(function(r){ r.classList.remove('on'); });
      } else {
        group.querySelectorAll(':scope > .radio').forEach(function(r){ r.classList.remove('on'); });
      }
      el.classList.add('on');
    });
  });
})();
</script>


<script>
(function(){
  var held = document.getElementById('held-feedback');
  var selected = null;
  document.querySelectorAll('.score-grid button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.score-grid button').forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selected = btn.getAttribute('data-score');
      if (held) { held.classList.remove('show'); held.textContent = ''; }
    });
  });
  var submit = document.getElementById('submit-score');
  if (submit) {
    submit.addEventListener('click', function(e){
      e.preventDefault();
      if (!selected) {
        if (held) {
          held.className = 'warn-note show';
          held.textContent = 'Pick a score 1–9 first.';
        }
        return;
      }
      if (held) {
        held.className = 'success-note show';
        held.innerHTML = '<strong>Score ' + selected + ' held for reveal</strong> · waiting other judges…';
      }
    });
  }
})();
</script>

</body>
</html>
